<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ohuhu — Sammlung laden</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Inter:wght@500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#F4E9E8; --paper-raised:#FBF5F4; --ink:#1E1C18; --ink-soft:#6E6A5E; --line:#E5D3D1; --accent:#0083C7; }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#10161F; --paper-raised:#182130; --ink:#E9E6DD; --ink-soft:#93989F; --line:#2B3849; --accent:#4FC1F0; }
    }
    body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--paper); color: var(--ink); }
    .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 40px; text-align: center; max-width: 360px; }
    h1 { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; font-weight: 600; color: var(--ink); margin: 0 0 8px; }
    h1 svg { color: var(--accent); }
    p { color: var(--ink-soft); font-size: 14px; font-weight: 500; margin: 0 0 24px; }
    .count { font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 600; color: var(--accent); display: block; margin-bottom: 4px; }
    .label { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="card">
    <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>Ohuhu</h1>
    <p>Deine Sammlung wird geladen…</p>
    <span class="count" id="num">0</span>
    <span class="label">Marker vorgemerkt</span>
  </div>
  <script src="./js/prefill.js"></script>
</body>
</html>
