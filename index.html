    // ── Config ────────────────────────────────────────────────────────────────
    // Google Cloud → APIs & Services → Credentials → OAuth 2.0 Client ID
    // Authorized JS origins: https://madeleine-neumann.github.io
    const CLIENT_ID = 'DEINE_GOOGLE_CLIENT_ID_HIER.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile';
    const FILE_NAME = 'polychromos_data.json';

    // ── Helpers ───────────────────────────────────────────────────────────────
    function darken(hex, amount = 0.72) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return '#' + [r,g,b].map(c => Math.round(c * amount).toString(16).padStart(2,'0')).join('');
    }

    // ── State ─────────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'polychromos_data';

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let currentView = localStorage.getItem('polychromos_view') || 'numeric';

    function isOwned(nr) { return !!(state[nr]?.owned); }
    function getOhuhu(nr) { return state[nr]?.ohuhu || ''; }
    function ownedCount() { return PENCILS.filter(p => isOwned(p.nr)).length; }

    function toggleOwned(nr) {
      state[nr] = state[nr] || {};
      state[nr].owned = !state[nr].owned;
      saveState();
      scheduleDriveSave();
      renderAll();
    }

    function setOhuhu(nr, value) {
      state[nr] = state[nr] || {};
      state[nr].ohuhu = value.trim();
      saveState();
      scheduleDriveSave();
    }

    function setView(view) {
      currentView = view;
      localStorage.setItem('polychromos_view', view);
      renderAll();
    }

    // ── Auth & Drive ──────────────────────────────────────────────────────────
    let tokenClient, gapiInited = false, gisInited = false;
    let currentUser = null;   // { name, picture }
    let driveFileId = null;
    let syncStatus = 'offline'; // 'offline' | 'syncing' | 'synced' | 'error'
    let driveSaveTimer = null;

    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({});
        gapiInited = true;
        checkApisReady();
      });
    }

    function gisLoaded() {
      if (CLIENT_ID.startsWith('DEINE')) { gisInited = true; checkApisReady(); return; }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: handleTokenResponse,
      });
      gisInited = true;
      checkApisReady();
    }

    function checkApisReady() {
      if (gapiInited && gisInited) renderAll();
    }

    async function handleTokenResponse(resp) {
      if (resp.error) { syncStatus = 'error'; renderAll(); return; }
      gapi.client.setToken(resp);
      currentUser = await fetchUserInfo(resp.access_token);
      await loadFromDrive();
      renderAll();
    }

    function signIn() {
      if (!tokenClient) return alert('CLIENT_ID nicht konfiguriert. Siehe Kommentar im Quellcode.');
      tokenClient.requestAccessToken({ prompt: currentUser ? '' : 'select_account' });
    }

    function signOut() {
      const token = gapi.client.getToken();
      if (token) { google.accounts.oauth2.revoke(token.access_token, () => {}); gapi.client.setToken(''); }
      currentUser = null; driveFileId = null; syncStatus = 'offline';
      renderAll();
    }

    async function fetchUserInfo(token) {
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: `Bearer ${token}` }
        });
        return await r.json();
      } catch { return null; }
    }

    async function loadFromDrive() {
      syncStatus = 'syncing'; updateSyncUI();
      try {
        const list = await gapi.client.request({
          path: 'https://www.googleapis.com/drive/v3/files',
          params: { spaces: 'appDataFolder', q: `name='${FILE_NAME}'`, fields: 'files(id)', pageSize: 1 }
        });
        const files = list.result.files || [];
        if (files.length > 0) {
          driveFileId = files[0].id;
          const res = await gapi.client.request({
            path: `https://www.googleapis.com/drive/v3/files/${driveFileId}`,
            params: { alt: 'media' }
          });
          state = typeof res.result === 'object' && res.result ? res.result : JSON.parse(res.body);
          saveState();
        } else {
          await saveToDriveNow();
        }
        syncStatus = 'synced';
      } catch(e) { console.error('Drive load:', e); syncStatus = 'error'; }
      updateSyncUI();
    }

    async function saveToDriveNow() {
      if (!gapi.client.getToken()) return;
      syncStatus = 'syncing'; updateSyncUI();
      const content = JSON.stringify(state);
      try {
        if (driveFileId) {
          await gapi.client.request({
            path: `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}`,
            method: 'PATCH',
            params: { uploadType: 'media' },
            headers: { 'Content-Type': 'application/json' },
            body: content,
          });
        } else {
          const b = 'poly-x7f';
          const meta = JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] });
          const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${b}--`;
          const r = await gapi.client.request({
            path: 'https://www.googleapis.com/upload/drive/v3/files',
            method: 'POST',
            params: { uploadType: 'multipart' },
            headers: { 'Content-Type': `multipart/related; boundary="${b}"` },
            body,
          });
          driveFileId = r.result.id;
        }
        syncStatus = 'synced';
      } catch(e) { console.error('Drive save:', e); syncStatus = 'error'; }
      updateSyncUI();
    }

    function scheduleDriveSave() {
      clearTimeout(driveSaveTimer);
      driveSaveTimer = setTimeout(saveToDriveNow, 1500);
    }

    function updateSyncUI() {
      const el = document.getElementById('sync-status');
      if (!el || !currentUser) return;
      const map = { syncing: '⏳', synced: '☁ gespeichert', error: '⚠ Fehler', offline: '' };
      el.textContent = map[syncStatus] || '';
    }

    // ── Render: Header ────────────────────────────────────────────────────────

      if (CLIENT_ID.startsWith('DEINE')) {

      }
      if (!currentUser) {
        return `
          <button onclick="signIn()" style="
            display:flex;align-items:center;gap:7px;
            padding:7px 14px;border-radius:20px;
            background:white;border:2px solid #e9d5ff;
            font-size:12px;font-weight:800;color:#7c3aed;
            cursor:pointer;transition:box-shadow 0.2s;
            box-shadow:0 1px 4px rgba(124,58,237,0.1);
          " onmouseover="this.style.boxShadow='0 3px 12px rgba(124,58,237,0.25)'" onmouseout="this.style.boxShadow='0 1px 4px rgba(124,58,237,0.1)'">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Mit Google anmelden
          </button>`;
      }
      const syncMap = { syncing: '⏳', synced: '☁', error: '⚠', offline: '' };
      return `
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="sync-status" style="font-size:11px;font-weight:700;color:#9333ea;">${syncMap[syncStatus] || ''} ${syncStatus === 'synced' ? 'gespeichert' : syncStatus === 'error' ? 'Fehler' : syncStatus === 'syncing' ? '…' : ''}</span>
          <img src="${currentUser.picture || ''}" style="width:28px;height:28px;border-radius:50%;border:2px solid #e9d5ff;" title="${currentUser.name || ''}">
          <button onclick="signOut()" style="font-size:11px;font-weight:800;color:#9333ea;background:#f3e8ff;border:none;padding:4px 10px;border-radius:20px;cursor:pointer;">Abmelden</button>
        </div>`;
    }

    function renderHeader() {
      const count = ownedCount();
      const pct = Math.round(count / PENCILS.length * 100);
      return `
        <div class="mb-8">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:12px;">
            <h1 class="text-4xl font-black leading-tight" style="background: linear-gradient(90deg, #c026d3, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
              🎨 Polychromos
            </h1>
            <div style="padding-top:6px;flex-shrink:0;">${renderAuthBar()}</div>
          </div>
          <p class="font-bold mb-4 text-sm" style="color: #a855f7;">Meine Stiftsammlung</p>

          <div class="flex items-center gap-3 mb-4">
            <div class="rounded-full h-2.5 overflow-hidden" style="flex:1;max-width:260px;background:#f3e8ff;">
              <div class="h-full rounded-full transition-all duration-500"
                   style="width: ${pct}%; background: linear-gradient(90deg, #c026d3, #7c3aed);"></div>
            </div>
            <span class="text-sm font-bold whitespace-nowrap" style="color: #9333ea;">
              ${count} / ${PENCILS.length} · ${pct}%
            </span>
          </div>

          <div class="flex gap-2">
            <button id="btn-numeric" onclick="setView('numeric')"
              class="px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-200 cursor-pointer">
              Nummerisch
            </button>
            <button id="btn-groups" onclick="setView('groups')"
              class="px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-200 cursor-pointer">
              Farbgruppen
            </button>
          </div>
        </div>
      `;
    }

    // ── Render: Tile ──────────────────────────────────────────────────────────
    function renderTile(p) {
      const owned = isOwned(p.nr);
      const ohuhu = getOhuhu(p.nr).replace(/"/g, '&quot;');
      const filterStyle = owned ? '' : 'filter: saturate(0.2) brightness(1.08); opacity: 0.5;';
      const badge = owned
        ? `<div style="position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#7c3aed;box-shadow:0 1px 5px rgba(0,0,0,0.25);">✓</div>`
        : '';

      return `<div
        onclick="toggleOwned(${p.nr})"
        title="${p.name} · Nr. ${p.nr} · Lichtechtheit: ${p.lf}"
        style="
          width:90px; height:114px;
          border-radius:18px;
          background: linear-gradient(160deg, ${p.color}, ${darken(p.color)});
          display:flex; flex-direction:column; align-items:center;
          justify-content:flex-start; padding:10px 5px 6px;
          cursor:pointer; position:relative;
          box-shadow: 0 3px 10px rgba(0,0,0,0.14);
          transition: transform 0.15s, box-shadow 0.15s;
          ${filterStyle}
          user-select:none;
        "
        onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 10px 28px rgba(0,0,0,0.2)'"
        onmouseout="this.style.transform='';this.style.boxShadow='0 3px 10px rgba(0,0,0,0.14)'">
        <div style="font-size:17px;font-weight:900;color:white;text-shadow:0 1px 4px rgba(0,0,0,0.4);line-height:1;letter-spacing:-0.5px;">${p.nr}</div>
        <div style="font-size:7.5px;font-weight:700;color:rgba(255,255,255,0.92);text-shadow:0 1px 3px rgba(0,0,0,0.35);text-align:center;margin-top:4px;line-height:1.25;padding:0 3px;word-break:break-word;">${p.name}</div>
        ${badge}
        <input
          type="text"
          value="${ohuhu}"
          placeholder="Ohuhu"
          maxlength="6"
          onclick="event.stopPropagation()"
          onchange="setOhuhu(${p.nr}, this.value)"
          onkeydown="if(event.key==='Enter')this.blur()"
          style="
            position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
            width:74px;
            background:rgba(255,255,255,0.18);
            border:1.5px solid rgba(255,255,255,0.45);
            border-radius:7px;
            padding:2px 4px;
            font-size:9px; font-weight:700;
            color:white; text-align:center;
            outline:none;
            font-family:'Nunito',sans-serif;
          "
          onfocus="this.style.background='rgba(255,255,255,0.38)';this.style.borderColor='rgba(255,255,255,0.9)'"
          onblur="this.style.background='rgba(255,255,255,0.18)';this.style.borderColor='rgba(255,255,255,0.45)'">
      </div>`;
    }

    // ── Render: Views ─────────────────────────────────────────────────────────
    const COLOR_GROUPS = [
      { label: "🟡 Gelbtöne",         nrs: [101,102,103,104,105,106,107,108,109,205] },
      { label: "🟠 Orangetöne",        nrs: [111,113,115] },
      { label: "🔴 Rottöne",           nrs: [117,118,121,131,219,223,225,226] },
      { label: "🌸 Rosa & Pink",       nrs: [119,123,124,125,127,128,129,130,132] },
      { label: "💜 Violett & Magenta", nrs: [133,134,135,136,137,138,160,194,249,263] },
      { label: "🔵 Blautöne",          nrs: [110,120,140,141,143,144,145,146,151,152,157,181,246,247] },
      { label: "🩵 Türkis",            nrs: [149,153,154,155] },
      { label: "🟢 Grüntöne",          nrs: [112,156,158,159,161,162,163,165,166,167,168,170,171,172,173,174,264,266,267,268,276,278] },
      { label: "🤎 Braun & Erde",      nrs: [169,175,176,177,178,179,180,182,183,184,185,186,187,188,189,190,191,192,193,280,283] },
      { label: "🩶 Grau & Schwarz",    nrs: [199,217,230,231,232,233,234,235,270,271,272,273,274,275] },
      { label: "✨ Metallic",           nrs: [250,251,252] },
    ];

    function renderNumeric() {
      return `<div style="display:flex;flex-wrap:wrap;gap:12px;">${PENCILS.map(p => renderTile(p)).join('')}</div>`;
    }

    function renderGroups() {
      const byNr = Object.fromEntries(PENCILS.map(p => [p.nr, p]));
      return COLOR_GROUPS.map(g => `
        <div style="margin-bottom:36px;">
          <h2 style="font-size:13px;font-weight:800;color:#7e22ce;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:14px;">${g.label}</h2>
          <div style="display:flex;flex-wrap:wrap;gap:12px;">${g.nrs.map(nr => byNr[nr] ? renderTile(byNr[nr]) : '').join('')}</div>
        </div>
      `).join('');
    }

    // ── Render: All ───────────────────────────────────────────────────────────
    function renderAll() {
      const app = document.getElementById('app');
      const grid = currentView === 'groups' ? renderGroups() : renderNumeric();
      app.innerHTML = renderHeader() + grid;

      // Style toggle buttons
      document.getElementById('btn-numeric').style.cssText =
        currentView === 'numeric'
          ? 'background:linear-gradient(90deg,#c026d3,#7c3aed);color:white;box-shadow:0 2px 10px rgba(168,85,247,0.45);'
          : 'background:#f3e8ff;color:#7e22ce;';
      document.getElementById('btn-groups').style.cssText =
        currentView === 'groups'
          ? 'background:linear-gradient(90deg,#c026d3,#7c3aed);color:white;box-shadow:0 2px 10px rgba(168,85,247,0.45);'
          : 'background:#f3e8ff;color:#7e22ce;';
    }

    renderAll();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
    }
  </script>
</body>
</html>
