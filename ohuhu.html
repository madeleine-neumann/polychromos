      { code:"RG030",  name:"Red Grey 03",      color:"#E8D0C8" },

      { code:"RG080",  name:"Red Grey 08",      color:"#B89090" },

      { code:"RG120",  name:"Red Grey 12",      color:"#886870" },

      { code:"GG1",    name:"Green Grey 1",     color:"#D8DDD0" },
      { code:"GG3",    name:"Green Grey 3",     color:"#B8C0B0" },
      { code:"GG5",    name:"Green Grey 5",     color:"#98A890" },
      { code:"GG9",    name:"Green Grey 9",     color:"#687060" },
      { code:"GG020",  name:"Green Grey 02",    color:"#E0E8D8" },
      { code:"GG040",  name:"Light Jade Green Grey",color:"#C8D8C0" },
      { code:"GG060",  name:"Green Grey 06",    color:"#A8B8A0" },
      { code:"GG110",  name:"Toner Grey",       color:"#888880" },
      { code:"YG040",  name:"Yellow Grey 04",   color:"#E0DEC0" },
      { code:"YG080",  name:"Yellow Grey 08",   color:"#C0B888" },
      { code:"MG020",  name:"Blue Grey 02",     color:"#D0D8E0" },
      { code:"MG030",  name:"Blue Grey 03",     color:"#C0C8D0" },
      { code:"MG060",  name:"Blue Grey 06",     color:"#909AB0" },
      { code:"MG100",  name:"Blue Grey 09",     color:"#707888" },
      { code:"BGII03", name:"Blue Grey II 3",   color:"#C0C8D8" },
      { code:"BGII05", name:"Blue Grey II 5",   color:"#A0ACBC" },
      { code:"BGII09", name:"Blue Grey II 9",   color:"#707888" },
      { code:"BG050",  name:"Cool Grey 05",     color:"#C8D0D8" },
      { code:"BG060",  name:"Deep Cool Grey",   color:"#909AA8" },
      { code:"BG070",  name:"Cool Grey 07",     color:"#788090" },
      // ── Fluoreszierend ────────────────────────────────────────────────────
      { code:"FY010",  name:"Fluorescent Yellow",color:"#FFFF00" },
      { code:"FY020",  name:"Fluorescent Orange",color:"#FF6600" },
      { code:"FY030",  name:"Fluorescent Red",  color:"#FF0044" },
      { code:"FY050",  name:"Fluorescent Violet",color:"#CC00FF" },
      // ── Schwarz ───────────────────────────────────────────────────────────
      { code:"120",    name:"Black",            color:"#111111" },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────
    function darken(hex, amount = 0.72) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return '#' + [r,g,b].map(c => Math.round(c * amount).toString(16).padStart(2,'0')).join('');
    }

    // ── State ─────────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'ohuhu_data';

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    let state = loadState();
    let currentView = localStorage.getItem('ohuhu_view') || 'numeric';

    function isOwned(code) { return !!(state[code]?.owned); }
    function ownedCount() { return MARKERS.filter(m => isOwned(m.code)).length; }

    function toggleOwned(code) {
      state[code] = state[code] || {};
      state[code].owned = !state[code].owned;
      saveState(); scheduleGistSave(); renderAll();
    }

    function setView(view) {
      currentView = view;
      localStorage.setItem('ohuhu_view', view);
      renderAll();
    }

    // ── GitHub Gist Sync ──────────────────────────────────────────────────────
    const TOKEN_KEY   = 'polychromos_gh_token'; // shared with Polychromos app
    const GIST_ID_KEY = 'ohuhu_gist_id';
    const GIST_FILE   = 'ohuhu_data.json';
    const GH_API      = 'https://api.github.com';

    let githubToken = localStorage.getItem(TOKEN_KEY) || '';
    let gistId      = localStorage.getItem(GIST_ID_KEY) || '';
    let syncStatus  = 'idle';
    let syncTimer   = null;

    function ghHeaders() {
      return { Authorization: `Bearer ${githubToken}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
    }

    async function connectGist() {
      const input = document.getElementById('token-input');
      const token = input?.value.trim();
      if (!token) return;
      githubToken = token;
      localStorage.setItem(TOKEN_KEY, token);
      gistId = ''; localStorage.removeItem(GIST_ID_KEY);
      await loadFromGist(); renderAll();
    }

    function disconnectGist() {
      githubToken = ''; localStorage.removeItem(TOKEN_KEY);
      gistId = '';     localStorage.removeItem(GIST_ID_KEY);
      syncStatus = 'idle'; renderAll();
    }

    async function ensureGistId() {
      if (gistId) return;
      const r = await fetch(`${GH_API}/gists?per_page=100`, { headers: ghHeaders() });
      if (!r.ok) throw new Error('Token ungültig');
      const gists = await r.json();
      const found = gists.find(g => g.files[GIST_FILE]);
      if (found) {
        gistId = found.id;
      } else {
        const cr = await fetch(`${GH_API}/gists`, {
          method: 'POST', headers: ghHeaders(),
          body: JSON.stringify({ description: 'Ohuhu Marker Sammlung', public: false,
            files: { [GIST_FILE]: { content: JSON.stringify(state) } } })
        });
        if (!cr.ok) throw new Error();
        gistId = (await cr.json()).id;
      }
      localStorage.setItem(GIST_ID_KEY, gistId);
    }

    async function loadFromGist() {
      if (!githubToken) return;
      syncStatus = 'syncing'; updateSyncUI();
      try {
        await ensureGistId();
        const r = await fetch(`${GH_API}/gists/${gistId}`, { headers: ghHeaders() });
        if (!r.ok) throw new Error();
        const data = await r.json();
        const content = data.files[GIST_FILE]?.content;
        if (content) { state = JSON.parse(content); saveState(); }
        syncStatus = 'synced';
      } catch(e) {
        syncStatus = 'error';
        gistId = ''; localStorage.removeItem(GIST_ID_KEY);
      }
      updateSyncUI();
    }

    async function saveToGist() {
      if (!githubToken) return;
      syncStatus = 'syncing'; updateSyncUI();
      try {
        await ensureGistId();
        const r = await fetch(`${GH_API}/gists/${gistId}`, {
          method: 'PATCH', headers: ghHeaders(),
          body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(state) } } })
        });
        if (!r.ok) throw new Error();
        syncStatus = 'synced';
      } catch(e) { syncStatus = 'error'; }
      updateSyncUI();
    }

    function scheduleGistSave() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(saveToGist, 1500);
    }

    function updateSyncUI() {
      const el = document.getElementById('sync-status');
      if (!el) return;
      const map = { idle: '', syncing: '⏳', synced: '☁ gespeichert', error: '⚠ Fehler' };
      el.textContent = map[syncStatus] || '';
    }

    if (githubToken) loadFromGist().then(() => renderAll());

    // ── Render ────────────────────────────────────────────────────────────────
    function codeClass(code) {
      if (code.length <= 3) return 'tile-code tile-code--lg';
      if (code.length <= 5) return 'tile-code tile-code--md';
      return 'tile-code tile-code--sm';
    }

    function renderAuthBar() {
      if (githubToken) {
        return `
          <div class="auth-bar">
            <span id="sync-status" class="sync-label">${{idle:'',syncing:'⏳',synced:'☁ gespeichert',error:'⚠ Fehler'}[syncStatus]||''}</span>
            <span class="connected-badge">✓ GitHub</span>
            <button class="auth-btn" onclick="disconnectGist()">Trennen</button>
          </div>`;
      }
      return `
        <div class="auth-bar">
          <input id="token-input" class="token-input" type="password" placeholder="GitHub Token"
            onkeydown="if(event.key==='Enter')connectGist()">
          <button class="connect-btn" onclick="connectGist()">Verbinden</button>
        </div>`;
    }

    function renderHeader() {
      const count = ownedCount();
      const pct = Math.round(count / MARKERS.length * 100);
      return `
        <div class="app-header">
          <div class="header-top">
            <div>
              <h1 class="app-title">🖊 Ohuhu Honolulu</h1>
              <p class="app-subtitle">Meine Markersammlung · 320 Farben</p>
            </div>
            ${renderAuthBar()}
          </div>
          <div class="progress-row">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="progress-label">${count} / ${MARKERS.length} · ${pct}%</span>
          </div>
          <div class="view-toggle">
            <button id="btn-numeric" class="toggle-btn" onclick="setView('numeric')">Nummerisch</button>
            <button id="btn-groups" class="toggle-btn" onclick="setView('groups')">Farbgruppen</button>
          </div>
        </div>`;
    }

    function renderTile(m) {
      const owned = isOwned(m.code);
      const badge = owned ? `<div class="tile-badge">✓</div>` : '';
      return `<div
        class="tile${owned ? '' : ' tile--unowned'}"
        onclick="toggleOwned('${m.code}')"
        title="${m.name} · ${m.code}"
        style="background:linear-gradient(160deg,${m.color},${darken(m.color)})">
        <div class="${codeClass(m.code)}">${m.code}</div>
        <div class="tile-name">${m.name}</div>
        ${badge}
      </div>`;
    }

    const COLOR_GROUPS = [
      { label: "Gelb (Y)",         codes: ["Y1","Y2","Y3","Y4","Y5","Y6","Y7","Y8","Y9","Y10","Y11","Y12","Y13","Y010","Y030","Y040","Y050","Y070","Y080","Y110","Y120","Y121","Y130","Y140","Y180","Y210","Y230","Y250","Y260","Y270"] },
      { label: "Orange (YR)",       codes: ["YR1","YR2","YR3","YR4","YR5","YR33","YR030","YR070","YR090","YR110","YR170","YR172","YR180","YR190","YR220","YR240","YR250","YR260"] },
      { label: "Rot & Pink",        codes: ["RV010","RV030","RV070","RV080","RV100","RV130","RV160","RV180","RV200","RV240","RV250","RV260","RV270","RV280","RV300","RV320","RV330","RV350","RP1","RP6","R1","R2","R3","R4","R5","R6","R7","R8","R9","R10","R11","R12","R13","R14","R15","R16","R17","R18","R19","R20","R21","R22","R23","R24","R25","R29","R050","R070","R080","R110","R120","R150","R160","R170","R180","R190","R200","R230","R240","R242","R250","R270","R280","R282","R284","R290","R340","R350"] },
      { label: "Violett & Lila",    codes: ["P1","P2","P3","P4","P5","V020","V030","V050","V060","V070","V080","V150","V160","V210","V230","V250","V270","V320","V322","V330","V340","V370","V390","V450"] },
      { label: "Blau",              codes: ["B030","B050","B070","B080","B090","B110","B120","B140","B180","B190","B220","B250","B260","B270","B290","B340","B350","B380","B440","B64","PB1","PB2","PB3","PB4","PB5","PB6","PB7","PB8","PB9","PB10","PB11"] },
      { label: "Blaugrün & Türkis", codes: ["BG1","BG2","BG3","BG4","BG5","BG6","BG7","BG8","BG9","BG68"] },
      { label: "Grün",              codes: ["G1","G2","G3","G4","G5","G6","G7","G8","G9","G020","G030","G050","G060","G070","G080","G110","G120","G130","G140","G170","G190","G220","G240","G260","G270","G300","G320","G322","G324","G326","G330","G340","G360","G390","G410","G420","G440","G470","G490","G500","GY1","GY2","GY3","GY4","GY5","GY6","GY7","GY8","GY42","GY43","GY172","GY173"] },
      { label: "Erde & Braun",      codes: ["E010","E030","E050","E060","E080","E090","E110","E120","E130","E160","E170","E210","E220","E240","E260","E280","E300","E310","E370","E380","E400","E430","E432","E434","E440","E450","E460","E470","E490","BR1","BR2","BR3","BR208"] },
      { label: "Warmgrau",          codes: ["WG01","WG3","WG4","WG050","WG070","WG090","WG09","WG130"] },
      { label: "Kaltgrau",          codes: ["CG2","CG5","CGII00","CGII04","CGII07","CGII08","CGII09","CG020","CG030","CG050","CG070","NG03","NG06","NG07","NG09"] },
      { label: "Spezialgrau",       codes: ["RG030","RG050","RG080","RG110","RG120","RG150","GG1","GG3","GG5","GG9","GG020","GG040","GG060","GG110","YG040","YG080","MG020","MG030","MG060","MG100","BGII03","BGII05","BGII09","BG050","BG060","BG070"] },
      { label: "Fluoreszierend",    codes: ["FY010","FY020","FY030","FY050"] },
      { label: "Schwarz",           codes: ["120"] },
    ];

    function groupGradient(codes, byCode) {
      const colors = codes.map(c => byCode[c]?.color).filter(Boolean);
      const n = 10;
      const samples = colors.length <= n
        ? colors
        : Array.from({length: n}, (_, i) => colors[Math.floor(i * colors.length / n)]);
      return `linear-gradient(90deg, ${samples.join(', ')})`;
    }

    function renderNumeric() {
      return `<div class="tile-grid">${MARKERS.map(m => renderTile(m)).join('')}</div>`;
    }

    function renderGroups() {
      const byCode = Object.fromEntries(MARKERS.map(m => [m.code, m]));
      return COLOR_GROUPS.map(g => `
        <div class="color-group">
          <div class="group-gradient" style="background:${groupGradient(g.codes, byCode)}"></div>
          <h2 class="group-heading">${g.label}</h2>
          <div class="tile-grid">${g.codes.map(c => byCode[c] ? renderTile(byCode[c]) : '').join('')}</div>
        </div>`).join('');
    }

    function renderAll() {
      const app = document.getElementById('app');
      app.innerHTML = renderHeader() + (currentView === 'groups' ? renderGroups() : renderNumeric());
      document.getElementById('btn-numeric').className = `toggle-btn toggle-btn--${currentView === 'numeric' ? 'active' : 'inactive'}`;
      document.getElementById('btn-groups').className  = `toggle-btn toggle-btn--${currentView === 'groups'  ? 'active' : 'inactive'}`;
    }

    renderAll();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
    }
  </script>
