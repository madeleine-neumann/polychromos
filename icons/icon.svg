<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c026d3"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- 4 × 3 colour swatch grid -->
  <!-- Row 1 -->
  <rect x="72"  y="88"  width="82" height="82" rx="16" fill="#FFD500"/>
  <rect x="170" y="88"  width="82" height="82" rx="16" fill="#FF6B00"/>
  <rect x="268" y="88"  width="82" height="82" rx="16" fill="#E91E63"/>
  <rect x="366" y="88"  width="82" height="82" rx="16" fill="#F48FB1"/>
  <!-- Row 2 -->
  <rect x="72"  y="186" width="82" height="82" rx="16" fill="#AB47BC"/>
  <rect x="170" y="186" width="82" height="82" rx="16" fill="#1976D2"/>
  <rect x="268" y="186" width="82" height="82" rx="16" fill="#00BCD4"/>
  <rect x="366" y="186" width="82" height="82" rx="16" fill="#43A047"/>
  <!-- Row 3 -->
  <rect x="72"  y="284" width="82" height="82" rx="16" fill="#8B5A2B"/>
  <rect x="170" y="284" width="82" height="82" rx="16" fill="#D4A055"/>
  <rect x="268" y="284" width="82" height="82" rx="16" fill="#9E9E9E"/>
  <rect x="366" y="284" width="82" height="82" rx="16" fill="#212121"/>

  <!-- Owned check mark on first tile -->
  <circle cx="113" cy="129" r="22" fill="white" opacity="0.95"/>
  <polyline points="102,129 111,139 126,118" fill="none" stroke="#c026d3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom white bar as branding accent -->
  <rect x="72" y="394" width="368" height="30" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="72" y="394" width="120" height="30" rx="8" fill="rgba(255,255,255,0.35)"/>
</svg>
